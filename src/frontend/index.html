<h1>Image Anonymisation</h1>

<input id="imageInput" type="file" accept="image/*" />
<p id="status">Status: Idle</p>

<div style="position: relative; display: inline-block;">
  <img id="preview" alt="Preview" style="max-width: 700px; display:none;" />
  <canvas id="overlay"
          style="position:absolute; left:0; top:0; pointer-events:auto; cursor:crosshair;">
  </canvas>
</div>

<button id="detectBtn" disabled>Detect</button>
<button id="confirmBtn" disabled>Confirm & Blur</button>

<pre id="output"></pre>

<script type="module" src="./src/main.js"></script>
